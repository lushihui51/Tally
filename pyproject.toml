[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[project]
name = "tally"
version = "0.1.0"
dependencies = [
    "anthropic",
    "fastapi",
    "psycopg2-binary",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "sqlalchemy",
    "uvicorn",
]
requires-python = ">=3.11"
description = "AI-powered spending tracker and cost settler application."

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
]
